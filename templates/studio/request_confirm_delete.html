{% extends "base.html" %}
{% block title %}Удаление заявки - Design.pro{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>Удаление заявки</h1>
  <p>Вы действительно хотите удалить заявку «{{ design_request.title }}»? Это действие нельзя отменить.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a class="btn btn-secondary" href="{% url 'cabinet' %}">Отмена</a>
  </form>
</section>
{% endblock %}
